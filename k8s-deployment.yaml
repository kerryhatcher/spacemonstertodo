apiVersion: apps/v1
kind: Deployment
metadata:
  name: space-monster-todo
  namespace: space-monster-todo
spec:
  replicas: 2
  selector:
    matchLabels:
      app: space-monster-todo
  template:
    metadata:
      labels:
        app: space-monster-todo
    spec:
      containers:
      - name: web
        image: space-monster-todo:latest
        imagePullPolicy: Never  # Use local Docker image
        ports:
        - containerPort: 80
        resources:
          limits:
            memory: "128Mi"
            cpu: "100m"
          requests:
            memory: "64Mi"
            cpu: "50m"
---
apiVersion: v1
kind: Service
metadata:
  name: space-monster-todo
  namespace: space-monster-todo
spec:
  selector:
    app: space-monster-todo
  ports:
  - port: 80
    targetPort: 80
  type: ClusterIP