apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: space-monster-todo-hpa
  namespace: space-monster-todo
  labels:
    app: space-monster-todo
    component: autoscaler
  annotations:
    description: "HPA for Space Monster Todo List to handle demo traffic spikes"
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: space-monster-todo
  
  minReplicas: 3
  maxReplicas: 10
  
  metrics:
  # CPU utilization metric
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 70
  
  # Memory utilization metric
  - type: Resource
    resource:
      name: memory
      target:
        type: Utilization
        averageUtilization: 80
  
  behavior:
    scaleUp:
      stabilizationWindowSeconds: 60
      policies:
      - type: Percent
        value: 100
        periodSeconds: 60
      - type: Pods
        value: 2
        periodSeconds: 60
      selectPolicy: Max
    
    scaleDown:
      stabilizationWindowSeconds: 300
      policies:
      - type: Percent
        value: 10
        periodSeconds: 60
      selectPolicy: Min